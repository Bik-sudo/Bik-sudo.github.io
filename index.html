<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUSTO — премиальная парфюмерия</title>
  <!-- Шрифты -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <style>
    /* ===== СБРОС И ПЕРЕМЕННЫЕ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold: #d4af37;
      --gold-light: #e8c84a;
      --gold-glow: rgba(212, 175, 55, 0.25);
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.15);
      --radius: 16px;
      --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== КАНВАС ДЛЯ ЧАСТИЦ ===== */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== ОБЩИЕ КОМПОНЕНТЫ ===== */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 48px;
      color: var(--text-primary);
    }
    .section-title span {
      color: var(--gold);
    }

    /* ===== ШАПКА / ЛОГОТИП ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding: 16px 0;
    }

    .header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      text-decoration: none;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      transition: var(--transition);
    }
    .logo:hover {
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.30);
    }

    /* ===== КОРЗИНА (иконка + дропдаун) ===== */
    .cart-wrapper {
      position: relative;
    }

    .cart-icon {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 40px;
      padding: 8px 16px 8px 12px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(4px);
    }
    .cart-icon:hover {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
      box-shadow: var(--shadow-gold);
    }

    .cart-icon .badge {
      background: var(--gold);
      color: #0a0a0a;
      font-weight: 600;
      font-size: 0.75rem;
      border-radius: 40px;
      padding: 2px 10px;
      min-width: 24px;
      text-align: center;
      transition: var(--transition);
    }

    .cart-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 340px;
      max-height: 420px;
      overflow-y: auto;
      background: #141414;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.97);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 200;
    }
    .cart-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .cart-dropdown::-webkit-scrollbar {
      width: 4px;
    }
    .cart-dropdown::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 8px;
    }

    .cart-dropdown .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
    }
    .cart-dropdown .cart-item:last-child {
      border-bottom: none;
    }

    .cart-dropdown .cart-item .name {
      font-weight: 500;
    }
    .cart-dropdown .cart-item .qty {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }
    .cart-dropdown .cart-item .price {
      color: var(--gold);
      font-weight: 600;
    }

    .cart-dropdown .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 14px 0 8px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      margin-top: 6px;
    }
    .cart-dropdown .cart-total .sum {
      color: var(--gold);
    }

    .cart-dropdown .btn-checkout {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin-top: 14px;
      background: var(--gold);
      border: none;
      border-radius: 40px;
      color: #0a0a0a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      text-decoration: none;
      font-family: var(--font-sans);
    }
    .cart-dropdown .btn-checkout:hover {
      background: var(--gold-light);
      transform: scale(1.01);
      box-shadow: 0 8px 28px rgba(212, 175, 55, 0.25);
    }

    .cart-empty-msg {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px 0;
      font-size: 0.95rem;
    }

    /* ===== ГЕРОЙ-БЛОК С 3D ФЛАКОНОМ ===== */
    .hero {
      position: relative;
      z-index: 1;
      padding: 60px 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
      min-height: 70vh;
    }

    .hero-content {
      flex: 1 1 360px;
    }

    .hero-content .sub {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .hero-content h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 6vw, 4.6rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .hero-content h1 span {
      color: var(--gold);
    }

    .hero-content p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 460px;
      margin-bottom: 32px;
    }

    .hero-content .btn-primary {
      display: inline-block;
      padding: 16px 48px;
      background: var(--gold);
      border: none;
      border-radius: 60px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 1rem;
      color: #0a0a0a;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(212, 175, 55, 0.2);
    }
    .hero-content .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-4px);
      box-shadow: 0 8px 40px rgba(212, 175, 55, 0.3);
    }

    /* 3D флакон — только CSS */
    .hero-3d {
      flex: 1 1 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
    }

    .bottle {
      width: 240px;
      height: 340px;
      position: relative;
      transform-style: preserve-3d;
      animation: spinBottle 18s infinite linear;
      transition: transform 0.3s ease;
    }

    .bottle:hover {
      animation-play-state: paused;
      transform: rotateY(15deg) scale(1.04);
    }

    @keyframes spinBottle {
      0%   { transform: rotateY(0deg) rotateX(4deg); }
      100% { transform: rotateY(360deg) rotateX(4deg); }
    }

    /* Грани флакона — имитация 3D */
    .bottle-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 30px 30px 18px 18px;
      background: linear-gradient(145deg, rgba(212, 175, 55, 0.12), rgba(20, 20, 20, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: inset 0 0 60px rgba(212, 175, 55, 0.04), 0 20px 60px rgba(0,0,0,0.5);
      backface-visibility: visible;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 2.8rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 6px;
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
    }

    /* Имитация граней без сложной геометрии — используем трансформации */
    .bottle-face:nth-child(1) { transform: translateZ(30px); }
    .bottle-face:nth-child(2) { transform: rotateY(90deg) translateZ(30px); }
    .bottle-face:nth-child(3) { transform: rotateY(180deg) translateZ(30px); }
    .bottle-face:nth-child(4) { transform: rotateY(-90deg) translateZ(30px); }
    .bottle-face:nth-child(5) { transform: rotateX(90deg) translateZ(30px); }
    .bottle-face:nth-child(6) { transform: rotateX(-90deg) translateZ(30px); }

    /* Упрощаем до красивого вращающегося блока с золотым свечением */
    .bottle-simple {
      width: 220px;
      height: 320px;
      border-radius: 40px 40px 24px 24px;
      background: radial-gradient(ellipse at 30% 20%, rgba(212,175,55,0.06), rgba(10,10,10,0.95));
      border: 1px solid rgba(212,175,55,0.2);
      box-shadow: 0 0 80px rgba(212,175,55,0.06), inset 0 0 80px rgba(212,175,55,0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 3.6rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 10px;
      text-shadow: 0 0 60px rgba(212,175,55,0.15);
      transform-style: preserve-3d;
      animation: spinBottleSimple 20s infinite linear;
      transition: var(--transition);
      position: relative;
    }
    .bottle-simple::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 20%;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
      border-radius: 50%;
    }
    .bottle-simple:hover {
      animation-play-state: paused;
      transform: scale(1.04) rotateY(10deg);
      border-color: rgba(212,175,55,0.4);
      box-shadow: 0 0 120px rgba(212,175,55,0.12);
    }

    @keyframes spinBottleSimple {
      0%   { transform: rotateY(0deg) rotateX(2deg); }
      100% { transform: rotateY(360deg) rotateX(2deg); }
    }

    /* ===== КАТАЛОГ ===== */
    .catalog {
      position: relative;
      z-index: 1;
      padding: 60px 0 80px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 32px;
    }

    .product-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px 20px 28px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(40px);
      cursor: default;
    }
    .product-card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.7s ease, transform 0.7s ease, box-shadow 0.4s ease, border-color 0.4s ease;
    }

    .product-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.02), transparent 70%);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }

    .product-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.03);
    }
    .product-card:hover::before {
      opacity: 1;
    }

    /* "Золотой блеск" при наведении */
    .product-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(212, 175, 55, 0.02), transparent, rgba(212, 175, 55, 0.02), transparent);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      animation: shimmer 6s infinite linear;
    }
    .product-card:hover::after {
      opacity: 1;
    }

    @keyframes shimmer {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .product-card .gender-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 4px;
    }

    .product-card h3 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }

    .product-card .brand-name {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .product-card .price {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .product-card .btn-add {
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 40px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      z-index: 2;
    }
    .product-card .btn-add:hover {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      box-shadow: 0 4px 24px rgba(212, 175, 55, 0.15);
    }

    /* ===== УВЕДОМЛЕНИЕ ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #141414;
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 16px 32px;
      border-radius: 60px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-primary);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast strong {
      color: var(--gold);
    }

    /* ===== ФУТЕР ===== */
    .footer {
      position: relative;
      z-index: 1;
      padding: 40px 0 32px;
      border-top: 1px solid rgba(212, 175, 55, 0.06);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .footer .logo-small {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    .footer p {
      opacity: 0.6;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 820px) {
      .hero {
        flex-direction: column;
        text-align: center;
        padding: 40px 0 60px;
      }
      .hero-content p {
        max-width: 100%;
      }
      .hero-content .btn-primary {
        padding: 14px 40px;
      }
      .bottle-simple {
        width: 180px;
        height: 260px;
        font-size: 2.8rem;
      }
      .cart-dropdown {
        width: 300px;
        right: -10px;
      }
      .section-title {
        font-size: 2rem;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
      }
    }

    @media (max-width: 480px) {
      .header .container {
        flex-wrap: wrap;
        gap: 12px;
      }
      .logo {
        font-size: 1.6rem;
      }
      .cart-icon {
        padding: 6px 12px;
        font-size: 0.85rem;
      }
      .hero-content h1 {
        font-size: 2.4rem;
      }
      .product-grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .product-card {
        padding: 16px 14px 20px;
      }
      .product-card h3 {
        font-size: 1.1rem;
      }
      .cart-dropdown {
        width: 280px;
        right: -20px;
        padding: 16px;
      }
      .toast {
        font-size: 0.85rem;
        padding: 14px 24px;
        white-space: normal;
        max-width: 90%;
      }
      .bottle-simple {
        width: 140px;
        height: 200px;
        font-size: 2.2rem;
      }
      .section-title {
        font-size: 1.6rem;
      }
    }

    @media (max-width: 400px) {
      .product-grid {
        grid-template-columns: 1fr;
        max-width: 260px;
        margin: 0 auto;
      }
    }

    /* Стили для скролла */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- ===== КАНВАС ДЛЯ ЧАСТИЦ ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <div class="container">
      <a href="#" class="logo">GUSTO</a>
      <div class="cart-wrapper">
        <button class="cart-icon" id="cartToggle" aria-label="Корзина">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="badge" id="cartCount">0</span>
        </button>
        <!-- Дропдаун корзины -->
        <div class="cart-dropdown" id="cartDropdown">
          <div id="cartItems">
            <div class="cart-empty-msg">Корзина пуста</div>
          </div>
          <div class="cart-total">
            <span>Итого</span>
            <span class="sum" id="cartTotal">0 ₽</span>
          </div>
          <a href="#" class="btn-checkout" id="checkoutBtn">Оформить заказ</a>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== ГЕРОЙ ===== -->
  <section class="hero container">
    <div class="hero-content">
      <div class="sub">✦ Премиум-парфюм</div>
      <h1>Добро пожаловать в <span>GUSTO</span></h1>
      <p>Ароматы, которые остаются в памяти. Коллекция из пяти уникальных композиций для мужчин и женщин.</p>
      <a href="#catalog" class="btn-primary">Открыть каталог</a>
    </div>
    <div class="hero-3d">
      <div class="bottle-simple">G</div>
    </div>
  </section>

  <!-- ===== КАТАЛОГ ===== -->
  <section class="catalog" id="catalog">
    <div class="container">
      <h2 class="section-title">Наши <span>ароматы</span></h2>
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <!-- ===== ФУТЕР ===== -->
  <footer class="footer">
    <div class="container">
      <div class="logo-small">GUSTO</div>
      <p>© 2026 GUSTO. Все права защищены.</p>
    </div>
  </footer>

  <!-- ===== УВЕДОМЛЕНИЕ ===== -->
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      'use strict';

      // ===== ДАННЫЕ ТОВАРОВ =====
      const products = [
        { id: 1, name: 'Oud Noir', brand: 'GUSTO', gender: 'мужской', price: 8900, desc: 'Древесный, восточный, с оттенками уда и шафрана.' },
        { id: 2, name: 'Cedar & Vetiver', brand: 'GUSTO', gender: 'мужской', price: 7600, desc: 'Кедр, ветивер, бергамот — свежий и благородный.' },
        { id: 3, name: 'Amber Leather', brand: 'GUSTO', gender: 'мужской', price: 8200, desc: 'Кожа, янтарь, табак — дерзкий и чувственный.' },
        { id: 4, name: 'Rose Velvet', brand: 'GUSTO', gender: 'женский', price: 9500, desc: 'Роза, пион, ваниль — нежный и утончённый.' },
        { id: 5, name: 'Jasmine Nuit', brand: 'GUSTO', gender: 'женский', price: 9200, desc: 'Жасмин, мускус, слива — таинственный и глубокий.' }
      ];

      // ===== СОСТОЯНИЕ =====
      let cart = [];
      const cartToggle = document.getElementById('cartToggle');
      const cartDropdown = document.getElementById('cartDropdown');
      const cartItemsEl = document.getElementById('cartItems');
      const cartCountEl = document.getElementById('cartCount');
      const cartTotalEl = document.getElementById('cartTotal');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const toastEl = document.getElementById('toast');
      let toastTimer = null;

      // ===== РЕНДЕР КАТАЛОГА =====
      const grid = document.getElementById('productGrid');

      function renderProducts() {
        grid.innerHTML = '';
        products.forEach((p, index) => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.dataset.index = index;
          card.innerHTML = `
            <div class="gender-tag">${p.gender}</div>
            <h3>${p.name}</h3>
            <div class="brand-name">${p.brand}</div>
            <div class="price">${p.price.toLocaleString()} ₽</div>
            <button class="btn-add" data-id="${p.id}">Добавить в корзину</button>
          `;
          grid.appendChild(card);

          // Анимация появления при скролле (Intersection Observer)
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                card.classList.add('visible');
                observer.unobserve(card);
              }
            });
          }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
          observer.observe(card);

          // Обработчик кнопки "Добавить"
          const btn = card.querySelector('.btn-add');
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = parseInt(btn.dataset.id);
            addToCart(id);
          });
        });
      }

      // ===== КОРЗИНА =====
      function addToCart(productId) {
        const existing = cart.find(item => item.id === productId);
        if (existing) {
          existing.qty += 1;
        } else {
          const product = products.find(p => p.id === productId);
          if (product) cart.push({ ...product, qty: 1 });
        }
        updateCartUI();
        showToast(`<strong>${products.find(p => p.id === productId).name}</strong> добавлен в корзину`);
      }

      function removeFromCart(productId) {
        cart = cart.filter(item => item.id !== productId);
        updateCartUI();
      }

      function getTotalItems() {
        return cart.reduce((sum, item) => sum + item.qty, 0);
      }

      function getTotalPrice() {
        return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      }

      function updateCartUI() {
        const totalItems = getTotalItems();
        cartCountEl.textContent = totalItems;

        if (cart.length === 0) {
          cartItemsEl.innerHTML = `<div class="cart-empty-msg">Корзина пуста</div>`;
          cartTotalEl.textContent = '0 ₽';
          return;
        }

        let html = '';
        cart.forEach(item => {
          html += `
            <div class="cart-item" data-id="${item.id}">
              <span class="name">${item.name}</span>
              <span class="qty">×${item.qty}</span>
              <span class="price">${(item.price * item.qty).toLocaleString()} ₽</span>
            </div>
          `;
        });
        cartItemsEl.innerHTML = html;
        cartTotalEl.textContent = getTotalPrice().toLocaleString() + ' ₽';

        // Клик по товару для удаления (опционально)
        document.querySelectorAll('.cart-item').forEach(el => {
          el.style.cursor = 'pointer';
          el.addEventListener('click', function() {
            const id = parseInt(this.dataset.id);
            removeFromCart(id);
            showToast('Товар удалён из корзины');
          });
        });
      }

      // ===== УВЕДОМЛЕНИЕ =====
      function showToast(message) {
        toastEl.innerHTML = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2800);
      }

      // ===== ОФОРМЛЕНИЕ ЗАКАЗА → TELEGRAM =====
      function getOrderMessage() {
        if (cart.length === 0) {
          showToast('Корзина пуста, добавьте товары');
          return null;
        }
        const items = cart.map(item => `${item.name} ×${item.qty}`).join(', ');
        const total = getTotalPrice().toLocaleString();
        return `Здравствуйте! Хочу заказать в GUSTO: ${items}. Общая сумма: ${total} ₽.`;
      }

      checkoutBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const msg = getOrderMessage();
        if (!msg) return;
        // Замените YOUR_USERNAME на ваш юзернейм в Telegram
        const url = `https://t.me/ваш_юзернейм?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
        // Не очищаем корзину, чтобы покупатель мог вернуться
      });

      // ===== ТОГГЛ КОРЗИНЫ =====
      cartToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        cartDropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.cart-wrapper')) {
          cartDropdown.classList.remove('open');
        }
      });

      // ===== ЧАСТИЦЫ (CANVAS) =====
      function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const particles = [];
        const COUNT = 60;

        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 2.5 + 0.8,
            dx: (Math.random() - 0.5) * 0.4,
            dy: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.4 + 0.1
          });
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > width) p.dx *= -1;
            if (p.y < 0 || p.y > height) p.dy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
            ctx.fill();
          });
          requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('resize', () => {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
          particles.forEach(p => {
            p.x = Math.min(p.x, width);
            p.y = Math.min(p.y, height);
          });
        });
      }

      // ===== ИНИЦИАЛИЗАЦИЯ =====
      renderProducts();
      updateCartUI();
      initParticles();

      // Добавляем плавное появление для карточек, которые уже видны сразу
      setTimeout(() => {
        document.querySelectorAll('.product-card').forEach(card => {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight - 100) {
            card.classList.add('visible');
          }
        });
      }, 200);

      console.log('🚀 GUSTO — сайт загружен. Премиум-парфюмерия.');
    })();
  </script>
</body>
</html>
