<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GUSTO — премиальная парфюмерия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0a;
      --bg-card: #141414;
      --gold: #d4af37;
      --gold-light: #e8c84a;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --font-serif: 'Playfair Display', serif;
      --font-sans: 'Inter', sans-serif;
      --shadow-gold: 0 8px 32px rgba(212, 175, 55, 0.15);
      --radius: 16px;
      --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 36px;
      color: var(--text-primary);
    }
    .section-title span {
      color: var(--gold);
    }

    /* ===== ШАПКА ===== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      padding: 16px 0;
    }
    .header .container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--gold);
      text-decoration: none;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
      transition: var(--transition);
    }
    .logo:hover {
      text-shadow: 0 0 40px rgba(212, 175, 55, 0.30);
    }

    /* ===== ПОИСК ===== */
    .search-wrap {
      flex: 1 1 260px;
      min-width: 160px;
      max-width: 380px;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }
    .search-wrap input::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }
    .search-wrap input:focus {
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 24px rgba(212, 175, 55, 0.04);
    }

    /* ===== КОРЗИНА ===== */
    .cart-wrapper {
      position: relative;
    }
    .cart-icon {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 40px;
      padding: 8px 16px 8px 12px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(4px);
    }
    .cart-icon:hover {
      border-color: var(--gold);
      background: rgba(212, 175, 55, 0.06);
      box-shadow: var(--shadow-gold);
    }
    .cart-icon .badge {
      background: var(--gold);
      color: #0a0a0a;
      font-weight: 600;
      font-size: 0.75rem;
      border-radius: 40px;
      padding: 2px 10px;
      min-width: 24px;
      text-align: center;
    }

    .cart-dropdown {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      width: 380px;
      max-height: 460px;
      overflow-y: auto;
      background: #141414;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.97);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 200;
    }
    .cart-dropdown.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .cart-dropdown::-webkit-scrollbar {
      width: 4px;
    }
    .cart-dropdown::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 8px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.9rem;
      gap: 8px;
    }
    .cart-item:last-child {
      border-bottom: none;
    }
    .cart-item .info {
      flex: 1;
    }
    .cart-item .name {
      font-weight: 500;
      display: block;
    }
    .cart-item .meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    .cart-item .qty-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-item .qty-control button {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      color: var(--text-primary);
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cart-item .qty-control button:hover {
      background: var(--gold);
      color: #0a0a0a;
    }
    .cart-item .qty-control span {
      min-width: 20px;
      text-align: center;
    }
    .cart-item .item-price {
      color: var(--gold);
      font-weight: 600;
      min-width: 80px;
      text-align: right;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 14px 0 8px;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      margin-top: 6px;
    }
    .cart-total .sum {
      color: var(--gold);
    }

    .cart-dropdown .btn-checkout {
      display: block;
      width: 100%;
      padding: 14px 0;
      margin-top: 14px;
      background: var(--gold);
      border: none;
      border-radius: 40px;
      color: #0a0a0a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: var(--transition);
      text-align: center;
      text-decoration: none;
      font-family: var(--font-sans);
    }
    .cart-dropdown .btn-checkout:hover {
      background: var(--gold-light);
      transform: scale(1.01);
      box-shadow: 0 8px 28px rgba(212, 175, 55, 0.25);
    }

    .cart-empty-msg {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px 0;
      font-size: 0.95rem;
    }

    /* ===== ФИЛЬТРЫ ===== */
    .filters {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filters button {
      padding: 10px 28px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 40px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
    }
    .filters button:hover {
      border-color: var(--gold);
      color: var(--text-primary);
      background: rgba(212, 175, 55, 0.04);
    }
    .filters button.active {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      font-weight: 600;
      box-shadow: 0 4px 24px rgba(212, 175, 55, 0.15);
    }

    /* ===== ГЕРОЙ ===== */
    .hero {
      position: relative;
      z-index: 1;
      padding: 60px 0 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      flex-wrap: wrap;
      min-height: 70vh;
    }
    .hero-content {
      flex: 1 1 360px;
    }
    .hero-content .sub {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .hero-content h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 6vw, 4.6rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    .hero-content h1 span {
      color: var(--gold);
    }
    .hero-content p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 460px;
      margin-bottom: 32px;
    }
    .hero-content .btn-primary {
      display: inline-block;
      padding: 16px 48px;
      background: var(--gold);
      border: none;
      border-radius: 60px;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 1rem;
      color: #0a0a0a;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(212, 175, 55, 0.2);
    }
    .hero-content .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-4px);
      box-shadow: 0 8px 40px rgba(212, 175, 55, 0.3);
    }

    .hero-3d {
      flex: 1 1 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 800px;
    }
    .bottle-simple {
      width: 220px;
      height: 320px;
      border-radius: 40px 40px 24px 24px;
      background: radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.06), rgba(10, 10, 10, 0.95));
      border: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 0 80px rgba(212, 175, 55, 0.06), inset 0 0 80px rgba(212, 175, 55, 0.02);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-serif);
      font-size: 3.6rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 10px;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
      transform-style: preserve-3d;
      animation: spinBottleSimple 20s infinite linear;
      transition: var(--transition);
      position: relative;
    }
    .bottle-simple::after {
      content: '';
      position: absolute;
      top: -2px;
      left: 20%;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.3;
      border-radius: 50%;
    }
    .bottle-simple:hover {
      animation-play-state: paused;
      transform: scale(1.04) rotateY(10deg);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: 0 0 120px rgba(212, 175, 55, 0.12);
    }
    @keyframes spinBottleSimple {
      0% {
        transform: rotateY(0deg) rotateX(2deg);
      }
      100% {
        transform: rotateY(360deg) rotateX(2deg);
      }
    }

    /* ===== КАТАЛОГ ===== */
    .catalog {
      position: relative;
      z-index: 1;
      padding: 40px 0 80px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 32px;
    }

    .product-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px 20px 28px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(40px);
      cursor: default;
    }
    .product-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .product-card.hidden {
      display: none;
    }

    .product-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(212, 175, 55, 0.02), transparent 70%);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .product-card:hover {
      transform: translateY(-8px) scale(1.01);
      border-color: rgba(212, 175, 55, 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(212, 175, 55, 0.03);
    }
    .product-card:hover::before {
      opacity: 1;
    }

    .product-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(212, 175, 55, 0.02), transparent, rgba(212, 175, 55, 0.02), transparent);
      opacity: 0;
      transition: opacity 0.8s ease;
      pointer-events: none;
      animation: shimmer 6s infinite linear;
    }
    .product-card:hover::after {
      opacity: 1;
    }
    @keyframes shimmer {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .product-card .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.02);
      transition: transform 0.5s ease;
    }
    .product-card:hover .product-image {
      transform: scale(1.04);
    }

    .product-card .gender-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      opacity: 0.6;
      margin-bottom: 4px;
    }
    .product-card h3 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-primary);
    }
    .product-card .brand-name {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    /* ===== ВЫБОР ОБЪЁМА ===== */
    .size-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .size-selector .size-btn {
      padding: 4px 14px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 30px;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 400;
    }
    .size-selector .size-btn:hover {
      border-color: var(--gold);
      color: var(--text-primary);
    }
    .size-selector .size-btn.active {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      font-weight: 600;
    }
    .size-selector .size-btn .price-tag {
      font-weight: 500;
      margin-left: 4px;
      color: var(--gold-light);
    }

    /* ===== ПАМЯТКА ДЛЯ ПОКУПАТЕЛЯ ===== */
    .product-reminder {
      background: rgba(212, 175, 55, 0.04);
      border: 1px solid rgba(212, 175, 55, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.6;
      transition: var(--transition);
    }
    .product-reminder strong {
      color: var(--gold);
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
      font-size: 0.8rem;
    }
    .product-reminder ol {
      padding-left: 18px;
      margin: 2px 0;
    }
    .product-reminder li {
      margin-bottom: 0px;
    }
    .product-reminder .tg-link {
      color: var(--gold);
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .product-card:hover .product-reminder {
      border-color: rgba(212, 175, 55, 0.2);
      background: rgba(212, 175, 55, 0.06);
    }

    .product-card .btn-add {
      width: 100%;
      padding: 12px 0;
      background: transparent;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 40px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      z-index: 2;
      margin-top: 6px;
    }
    .product-card .btn-add:hover {
      background: var(--gold);
      color: #0a0a0a;
      border-color: var(--gold);
      box-shadow: 0 4px 24px rgba(212, 175, 55, 0.15);
    }

    /* ===== УВЕДОМЛЕНИЕ ===== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #141414;
      border: 1px solid rgba(212, 175, 55, 0.2);
      padding: 16px 32px;
      border-radius: 60px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      color: var(--text-primary);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast strong {
      color: var(--gold);
    }

    /* ===== ФУТЕР ===== */
    .footer {
      position: relative;
      z-index: 1;
      padding: 40px 0 32px;
      border-top: 1px solid rgba(212, 175, 55, 0.06);
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    .footer .logo-small {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 4px;
      margin-bottom: 6px;
    }
    .footer p {
      opacity: 0.6;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 820px) {
      .hero {
        flex-direction: column;
        text-align: center;
        padding: 40px 0 60px;
      }
      .hero-content p {
        max-width: 100%;
      }
      .hero-content .btn-primary {
        padding: 14px 40px;
      }
      .bottle-simple {
        width: 180px;
        height: 260px;
        font-size: 2.8rem;
      }
      .cart-dropdown {
        width: 320px;
        right: -10px;
      }
      .section-title {
        font-size: 2rem;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 24px;
      }
      .search-wrap {
        flex: 1 1 100%;
        max-width: 100%;
        order: 3;
      }
      .header .container {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .header .container {
        flex-wrap: wrap;
        gap: 8px;
      }
      .logo {
        font-size: 1.6rem;
      }
      .cart-icon {
        padding: 6px 12px;
        font-size: 0.85rem;
      }
      .hero-content h1 {
        font-size: 2.4rem;
      }
      .product-grid {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .product-card {
        padding: 16px 14px 20px;
      }
      .product-card h3 {
        font-size: 1.1rem;
      }
      .cart-dropdown {
        width: 290px;
        right: -20px;
        padding: 16px;
      }
      .toast {
        font-size: 0.85rem;
        padding: 14px 24px;
        white-space: normal;
        max-width: 90%;
      }
      .bottle-simple {
        width: 140px;
        height: 200px;
        font-size: 2.2rem;
      }
      .section-title {
        font-size: 1.6rem;
      }
      .filters button {
        padding: 6px 16px;
        font-size: 0.8rem;
      }
      .size-selector .size-btn {
        font-size: 0.7rem;
        padding: 3px 10px;
      }
      .cart-item {
        font-size: 0.8rem;
        flex-wrap: wrap;
      }
      .cart-item .item-price {
        min-width: 60px;
      }
      .cart-dropdown .cart-item .qty-control button {
        width: 24px;
        height: 24px;
        font-size: 0.8rem;
      }
      .product-reminder {
        font-size: 0.65rem;
        padding: 8px 10px;
      }
    }

    @media (max-width: 400px) {
      .product-grid {
        grid-template-columns: 1fr;
        max-width: 260px;
        margin: 0 auto;
      }
    }

    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--gold);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- ===== ЧАСТИЦЫ ===== -->
  <canvas id="particles-canvas"></canvas>

  <!-- ===== ШАПКА ===== -->
  <header class="header">
    <div class="container">
      <a href="#" class="logo">GUSTO</a>

        // === НОВЫЕ ЖЕНСКИЕ ===
        {

          image: 'https://avatars.mds.yandex.net/i?id=9g8e4fc8a5a8f8e4e8e4e8e4e8e4e8e4e8e4e8e4-10415032-images-thumbs&n=13',
          sizes: [
            { ml: 30, price: '—' },
            { ml: 50, price: '—' },
            { ml: 80, price: '—' }
          ]
        },
        {
          id: 13,
          name: 'La Vie Est Belle',
          brand: 'Lancôme',
          gender: 'женский',
          desc: 'Ирис, жасмин, пачули. Оптимистичный, нежный, женственный.',
          image: 'https://avatars.mds.yandex.net/i?id=ah8e4fc8a5a8f8e4e8e4e8e4e8e4e8e4e8e4e8e4-10415032-images-thumbs&n=13',
          sizes: [
            { ml: 30, price: '—' },
            { ml: 50, price: '—' },
            { ml: 75, price: '—' }
          ]
        },
        {
          id: 14,
          name: 'Coco Mademoiselle',
          brand: 'Chanel',
          gender: 'женский',
          desc: 'Апельсин, жасмин, пачули. Элегантный, утончённый, вне времени.',
          image: 'https://avatars.mds.yandex.net/i?id=bi8e4fc8a5a8f8e4e8e4e8e4e8e4e8e4e8e4e8e4-10415032-images-thumbs&n=13',
          sizes: [
            { ml: 50, price: '—' },
            { ml: 100, price: '—' }
          ]
        }
      ];

      // ============================================================
      // СОСТОЯНИЕ
      // ============================================================
      let cart = [];
      let currentFilter = 'all';
      let searchQuery = '';

      const cartToggle = document.getElementById('cartToggle');
      const cartDropdown = document.getElementById('cartDropdown');
      const cartItemsEl = document.getElementById('cartItems');
      const cartCountEl = document.getElementById('cartCount');
      const cartTotalEl = document.getElementById('cartTotal');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const toastEl = document.getElementById('toast');
      const grid = document.getElementById('productGrid');
      const searchInput = document.getElementById('searchInput');
      const filterButtons = document.querySelectorAll('#filterButtons button');

      let toastTimer = null;

      // ============================================================
      // РЕНДЕР КАТАЛОГА С ПАМЯТКОЙ
      // ============================================================
      function renderProducts() {
        grid.innerHTML = '';

        const filtered = products.filter(p => {
          const matchGender = currentFilter === 'all' || p.gender === currentFilter;
          const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.brand.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.desc.toLowerCase().includes(searchQuery.toLowerCase());
          return matchGender && matchSearch;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-secondary);font-size:1.2rem;">Ароматов не найдено</div>`;
          return;
        }

        filtered.forEach((p, index) => {
          const card = document.createElement('div');
          card.className = 'product-card';
          card.dataset.index = index;

          let sizesHtml = '';
          p.sizes.forEach((s, idx) => {
            const active = idx === 0 ? 'active' : '';
            sizesHtml += `<button class="size-btn ${active}" data-ml="${s.ml}" data-price="${s.price}">${s.ml} мл <span class="price-tag">${s.price}</span></button>`;
          });

          // ===== ПАМЯТКА ИЗ 4 ПУНКТОВ =====
          const reminderHtml = `
            <div class="product-reminder">
              <strong>📋 ПАМЯТКА ПЕРЕД ЗАКАЗОМ:</strong>
              <ol>
                <li>📸 Сделайте скриншот этой карточки с выбранным объёмом</li>
                <li>💬 Напишите нам в Telegram — кнопка ниже</li>
                <li>📦 Укажите, какой объём вас интересует</li>
                <li>💰 Все цены и детали обсуждаются в личном сообщении</li>
              </ol>
            </div>
          `;

          card.innerHTML = `
            <img class="product-image" src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x400/d4af37/0a0a0a?text=${p.name.replace(/ /g,'+')}'" />
            <div class="gender-tag">${p.gender}</div>
            <h3>${p.name}</h3>
            <div class="brand-name">${p.brand}</div>
            <div class="size-selector" data-product-id="${p.id}">${sizesHtml}</div>
            ${reminderHtml}
            <button class="btn-add" data-id="${p.id}">📱 Заказать в Telegram</button>
          `;

          grid.appendChild(card);

          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                card.classList.add('visible');
                observer.unobserve(card);
              }
            });
          }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
          observer.observe(card);

          const sizeBtns = card.querySelectorAll('.size-btn');
          sizeBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              sizeBtns.forEach(b => b.classList.remove('active'));
              this.classList.add('active');
            });
          });

          const btn = card.querySelector('.btn-add');
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            const activeSize = card.querySelector('.size-btn.active');
            if (activeSize) {
              const ml = parseInt(activeSize.dataset.ml);
              addToCart(id, ml);
            } else {
              const firstSize = p.sizes[0];
              addToCart(id, firstSize.ml);
            }
          });
        });
      }

      // ============================================================
      // КОРЗИНА
      // ============================================================
      function addToCart(productId, ml) {
        const product = products.find(p => p.id === productId);
        if (!product) return;

        const existing = cart.find(item => item.id === productId && item.ml === ml);
        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({
            id: product.id,
            name: product.name,
            brand: product.brand,
            ml: ml,
            qty: 1
          });
        }
        updateCartUI();
        showToast(`<strong>${product.name}</strong> (${ml} мл) добавлен в корзину`);
      }

      function removeFromCart(productId, ml) {
        cart = cart.filter(item => !(item.id === productId && item.ml === ml));
        updateCartUI();
      }

      function updateQty(productId, ml, delta) {
        const item = cart.find(i => i.id === productId && i.ml === ml);
        if (!item) return;
        item.qty += delta;
        if (item.qty <= 0) {
          removeFromCart(productId, ml);
        } else {
          updateCartUI();
        }
      }

      function getTotalItems() {
        return cart.reduce((sum, item) => sum + item.qty, 0);
      }

      function updateCartUI() {
        const totalItems = getTotalItems();
        cartCountEl.textContent = totalItems;

        if (cart.length === 0) {
          cartItemsEl.innerHTML = `<div class="cart-empty-msg">Корзина пуста</div>`;
          cartTotalEl.textContent = 'Цена в Telegram';
          return;
        }

        let html = '';
        cart.forEach(item => {
          html += `
            <div class="cart-item" data-id="${item.id}" data-ml="${item.ml}">
              <div class="info">
                <span class="name">${item.name}</span>
                <span class="meta">${item.brand} — ${item.ml} мл</span>
              </div>
              <div class="qty-control">
                <button class="qty-minus" data-id="${item.id}" data-ml="${item.ml}">−</button>
                <span>${item.qty}</span>
                <button class="qty-plus" data-id="${item.id}" data-ml="${item.ml}">+</button>
              </div>
              <span class="item-price">Цена в Telegram</span>
            </div>
          `;
        });
        cartItemsEl.innerHTML = html;
        cartTotalEl.textContent = 'Цена в Telegram';

        document.querySelectorAll('.qty-minus').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            const ml = parseInt(this.dataset.ml);
            updateQty(id, ml, -1);
          });
        });
        document.querySelectorAll('.qty-plus').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = parseInt(this.dataset.id);
            const ml = parseInt(this.dataset.ml);
            updateQty(id, ml, 1);
          });
        });
      }

      // ============================================================
      // УВЕДОМЛЕНИЕ
      // ============================================================
      function showToast(message) {
        toastEl.innerHTML = message;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2800);
      }

      // ============================================================
      // ОФОРМЛЕНИЕ ЗАКАЗА → TELEGRAM
      // ============================================================
      function getOrderMessage() {
        if (cart.length === 0) {
          showToast('Корзина пуста, добавьте товары');
          return null;
        }
        const items = cart.map(item => `${item.name} (${item.ml} мл) ×${item.qty}`).join(', ');
        return `Здравствуйте! Хочу заказать в GUSTO: ${items}. Уточните, пожалуйста, стоимость и наличие.`;
      }

      checkoutBtn.addEventListener('click', function(e) {
        e.preventDefault();
        const msg = getOrderMessage();
        if (!msg) return;
        const url = `https://t.me/ваш_юзернейм?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
      });

      // ============================================================
      // ФИЛЬТРЫ
      // ============================================================
      filterButtons.forEach(btn => {
        btn.addEventListener('click', function() {
          filterButtons.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderProducts();
        });
      });

      // ============================================================
      // ПОИСК
      // ============================================================
      searchInput.addEventListener('input', function() {
        searchQuery = this.value;
        renderProducts();
      });

      // ============================================================
      // ТОГГЛ КОРЗИНЫ
      // ============================================================
      cartToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        cartDropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.cart-wrapper')) {
          cartDropdown.classList.remove('open');
        }
      });

      // ============================================================
      // ЧАСТИЦЫ (CANVAS)
      // ============================================================
      function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        const particles = [];
        const COUNT = 60;

        for (let i = 0; i < COUNT; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 2.5 + 0.8,
            dx: (Math.random() - 0.5) * 0.4,
            dy: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.4 + 0.1
          });
        }

        function draw() {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > width) p.dx *= -1;
            if (p.y < 0 || p.y > height) p.dy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(212, 175, 55, ${p.alpha})`;
            ctx.fill();
          });
          requestAnimationFrame(draw);
        }

        draw();

        window.addEventListener('resize', () => {
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width;
          canvas.height = height;
          particles.forEach(p => {
            p.x = Math.min(p.x, width);
            p.y = Math.min(p.y, height);
          });
        });
      }

      // ============================================================
      // ИНИЦИАЛИЗАЦИЯ
      // ============================================================
      renderProducts();
      updateCartUI();
      initParticles();

      setTimeout(() => {
        document.querySelectorAll('.product-card').forEach(card => {
          const rect = card.getBoundingClientRect();
          if (rect.top < window.innerHeight - 100) {
            card.classList.add('visible');
          }
        });
      }, 200);

      console.log('🚀 GUSTO — магазин парфюма загружен. Все цены обсуждаются в Telegram.');
    })();
